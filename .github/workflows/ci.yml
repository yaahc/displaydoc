on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

name: Continuous integration

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - 1.71.0
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
      - name: Downgrade deps for MSRV
        if: ${{ matrix.rust == '1.71.0' }}
        run: |
          cargo update -p trybuild --precise 1.0.111
          cargo update -p indexmap --precise 2.13.1
          cargo update -p toml --precise 0.9.6
          cargo update -p toml_datetime --precise 0.7.1
          cargo update -p toml_parser --precise 1.0.2
          cargo update -p toml_writer --precise 1.0.2
          cargo update -p serde_spanned --precise 1.0.1
      - uses: actions-rs/cargo@v1
        with:
          command: check

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - nightly
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: Swatinem/rust-cache@v1
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      - uses: actions-rs/cargo@v1
        with:
          command: nextest
          args: run
      - uses: actions-rs/cargo@v1
        with:
          command: nextest
          args: run --no-default-features
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --doc

  test-msrv:
    name: msrv Test Suite
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.71.0
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
      - uses: Swatinem/rust-cache@v1
      - name: Downgrade deps for MSRV
        run: |
          cargo update -p trybuild --precise 1.0.111
          cargo update -p indexmap --precise 2.13.1
          cargo update -p toml --precise 0.9.6
          cargo update -p toml_datetime --precise 0.7.1
          cargo update -p toml_parser --precise 1.0.2
          cargo update -p toml_writer --precise 1.0.2
          cargo update -p serde_spanned --precise 1.0.1
      - uses: actions-rs/cargo@v1
        with:
          command: test
      - uses: actions-rs/cargo@v1
        with:
          command: test
          args: --no-default-features

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
          - 1.71.0
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
      - run: rustup component add rustfmt
      - uses: actions-rs/cargo@v1
        with:
          command: fmt
          args: --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - stable
    steps:
      - uses: actions/checkout@v1
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ matrix.rust }}
          override: true
      - run: rustup component add clippy
      - uses: actions-rs/cargo@v1
        with:
          command: clippy
          args: -- -D warnings
